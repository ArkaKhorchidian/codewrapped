[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "codewrapped"
version = "0.1.0"
description = "Spotify Wrapped for your code: your year in commits across every git repo on your machine, with a shareable card"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/codewrapped/fonts/OFL.txt"]
authors = [{ name = "Arka Khorchidian" }]
requires-python = ">=3.9"
dependencies = ["rich>=13", "pillow>=9.2", "pyfiglet>=0.8"]
keywords = ["git", "wrapped", "year-in-review", "developer", "commits", "github", "stats", "cli", "fun"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Utilities",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
codewrapped = "codewrapped.cli:run"

[project.urls]
Homepage = "https://github.com/ArkaKhorchidian/codewrapped"
Issues = "https://github.com/ArkaKhorchidian/codewrapped/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/codewrapped"]

[tool.hatch.build.targets.sdist]
exclude = ["docs", ".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
